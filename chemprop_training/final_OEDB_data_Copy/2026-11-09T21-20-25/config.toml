smiles-columns = [cation SMILES, Anion SMILES, Solvent SMILES]
descriptors-columns = [Concentration (mol/kg)]
data-path = [final_OEDB_data_Copy.csv]
message-hidden-dim = [300]
depth = [3]
activation = LEAKYRELU
ffn-hidden-dim = [300]
ffn-num-layers = 1
target-columns = [log(ionic conductivity)]
metrics = [rmse, r2]
show-individual-scores = true
epochs = 150
num-replicates = 1
save-smiles-splits = true
num-workers = 0
batch-size = 64
accelerator = auto
devices = auto
rxn-mode = REAC_DIFF
multi-hot-atom-featurizer-mode = V2
frzn-ffn-layers = 0
ensemble-size = 1
dropout = 0.0
aggregation = norm
aggregation-norm = 100
multiclass-num-classes = 3
atom-ffn-hidden-dim = [300]
atom-ffn-num-layers = 1
atom-multiclass-num-classes = 3
bond-ffn-hidden-dim = [300]
bond-ffn-num-layers = 1
bond-multiclass-num-classes = 3
atom-constrainer-ffn-hidden-dim = [300]
atom-constrainer-ffn-num-layers = 1
bond-constrainer-ffn-hidden-dim = [300]
bond-constrainer-ffn-num-layers = 1
task-type = regression
v-kl = 0.0
eps = 1e-08
alpha = 0.1
tracking-metric = val_loss
warmup-epochs = 2
init-lr = 0.0001
max-lr = 0.001
final-lr = 0.0001
min-delta = 0.0
split = RANDOM
split-sizes = [0.8, 0.1, 0.1]
split-key-molecule = 0
data-seed = 0
